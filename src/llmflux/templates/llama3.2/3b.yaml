# Llama 3.2 3B Configuration
name: "llama3.2:3b"
hf_name: "meta-llama/Llama-3.2-3B-Instruct"

resources:
  gpu_layers: 32
  gpu_memory: "16GB"
  batch_size: 8
  max_concurrent: 2

parameters:
  temperature: 0.7
  top_p: 0.9
  max_tokens: 2048
  stop_sequences: ["###"]  # Default stop sequence from test_prompts.json

system:
  prompt: "You are a helpful AI assistant. You are direct, accurate, and helpful in your responses."

validation:
  temperature_range: [0.0, 1.0]
  max_tokens_limit: 4096
  batch_size_range: [1, 16]
  concurrent_range: [1, 4]

# Resource Requirements
requirements:
  min_gpu_memory: "16GB"  # Minimum required for safe operation
  recommended_gpu: "A100"
  cuda_version: ">=12.0"
  cpu_threads: 4
  gpu_memory_utilization: 0.9 