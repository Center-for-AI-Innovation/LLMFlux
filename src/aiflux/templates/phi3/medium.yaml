# Phi-3 Medium Configuration
name: "phi3:medium"
hf_name: "microsoft/Phi-3-medium-4k-instruct"

resources:
  gpu_layers: 36
  gpu_memory: "24GB"
  batch_size: 8
  max_concurrent: 2

parameters:
  temperature: 0.7
  top_p: 0.9
  max_tokens: 2048
  stop_sequences: ["<|end|>", "<|user|>", "<|assistant|>"]  # Default stop sequence

system:
  prompt: "You are a helpful AI assistant. You are direct, accurate, and helpful in your responses."

validation:
  temperature_range: [0.0, 1.0]
  max_tokens_limit: 4096
  batch_size_range: [1, 16]
  concurrent_range: [1, 4]

# Resource Requirements
requirements:
  min_gpu_memory: "24GB"  # Minimum required for safe operation
  recommended_gpu: "A100"  # Can run on smaller GPUs too
  cuda_version: ">=11.7"
  cpu_threads: 4
  gpu_memory_utilization: 0.9 