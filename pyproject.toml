[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmflux"
version = "2.0.0"
description = "CLI tool for running LLM batch processing jobs on HPC systems"
readme = "docs/README.md"
license = {text = "MIT"}
authors = [
    {name = "Rohan Marwaha", email = "rohan13@illinois.edu"}
]
requires-python = ">=3.11"
keywords = ["llm", "batch-processing", "slurm", "hpc", "ai", "machine-learning", "ollama", "vllm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "pydantic>=2.11.7",
    "openai>=1.109.1",
    "pandas>=2.3.2",
    "datasets>=4.2.0"
]
[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-xdist>=3.0.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-xdist>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/Center-for-AI-Innovation/llmflux"
Repository = "https://github.com/Center-for-AI-Innovation/llmflux"
Issues = "https://github.com/Center-for-AI-Innovation/llmflux/issues"

[project.scripts]
llmflux = "llmflux.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"llmflux" = [
    "templates/models.yaml",
    "container/*.def",
    "slurm/*.sh"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = [".*", "build", "dist", "*.egg-info", ".venv", "backups", "tmp"]
addopts = "--import-mode=importlib"
